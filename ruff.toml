# Lint settings. Run `ruff check` from the repository root.
target-version = "py39"
line-length = 120

[lint]
select = ["E4", "E7", "E9", "F"]

[lint.per-file-ignores]
# A test puts a throwaway data folder in place before it imports the package, so its imports come second.
"tests/*" = ["E402", "E741"]
