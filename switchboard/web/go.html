<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Opening as its owner</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cstyle%3E@media (prefers-color-scheme:dark)%7B.r%7Bstroke:%233a3a3c%7D%7D%3C/style%3E%3Crect width='24' height='24' rx='5.5' fill='%231d1d1f'/%3E%3Crect class='r' x='.6' y='.6' width='22.8' height='22.8' rx='4.9' fill='none' stroke='none' stroke-width='1.2'/%3E%3Cpath d='M16.3 7H10.05a2.5 2.5 0 0 0 0 5h4.25a2.5 2.5 0 0 1 0 5H7.55' fill='none' stroke='%23fff' stroke-width='2.2' stroke-linecap='round'/%3E%3Ccircle cx='7.55' cy='17' r='2.2' fill='%23fff'/%3E%3Ccircle cx='16.3' cy='7' r='2.3' fill='%233b9eff'/%3E%3C/svg%3E">
<style>
body { margin: 0; display: grid; place-items: center; min-height: 100vh; background: #f4f5f7; color: #15171c;
  font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif; }
main { max-width: 480px; padding: 24px 16px; text-align: center; }
h1 { font-size: 22px; letter-spacing: -.02em; margin: 0 0 8px; }
p { color: #666c78; font-size: 14.5px; margin: 0; overflow-wrap: anywhere; }
button { margin-top: 20px; font: inherit; font-weight: 550; font-size: 14.5px; color: #fff; background: #1f5fd6; border: 0; border-radius: 999px; padding: 8px 18px; cursor: pointer; }
button + button { margin-left: 8px; }
@media (prefers-color-scheme: dark) { body { background: #0d0e11; color: #eef0f4; } p { color: #9399a6; } button { background: #5b96ff; color: #0b0d10; } }
</style>
<main><h1 id="h"></h1><p id="p"></p><button id="b" hidden>Open as its owner</button><button id="s" hidden>Set up</button></main>
<script>
// "auto" is true only when this visit carried the key from your own bookmark.
// Any other visit, such as a link on some website, has to be clicked first.
// Every word below is written with textContent: nothing from the address is ever read as HTML.
const auto = __AUTO__;
const h = document.getElementById('h'), p = document.getElementById('p'), b = document.getElementById('b'),
  s = document.getElementById('s');
const LINK = /^https:\/\/claude\.ai\/(code\/)?artifact\/[A-Za-z0-9_-]{16,}/;
let url = '', owner = '';
try { url = decodeURIComponent(location.hash.slice(1)); } catch (e) { url = ''; }
// Switchboard itself sends a click here when the page's owner has no browser profile signed in as it:
// #owner=<email>&url=<link> (one encoded part).
if (url.startsWith('owner=')) {
  const q = new URLSearchParams(url);
  owner = (q.get('owner') || '').slice(0, 200);
  url = q.get('url') || '';
}

function post(path, body) {
  return fetch(path, {method: 'POST', headers: {'Content-Type': 'application/json', 'X-Switchboard': '1'}, body: JSON.stringify(body)})
    .then((r) => r.json().then((d) => { if (!r.ok) { const e = new Error(d.error || 'Switchboard said no.'); e.fix = d.fix; throw e; } return d; }));
}

function show(head, text) { h.textContent = head; p.textContent = text; }

function noProfile(who) {
  b.hidden = true;
  show('No Chrome profile is signed in as ' + who,
       'This page belongs to ' + who + '. Set up makes a browser profile for it and opens claude.ai there: one sign-in, then the page opens.');
  s.textContent = 'Set up';
  s.hidden = false;
  s.onclick = () => setup(who);
}

function setup(who) {
  s.hidden = true;
  show('Making a profile for ' + who + '…', '');
  // The page's own Set up; an older page knows only "a new profile" for an account.
  post('/api/setup-profile', {email: who})
    .catch((e) => { if (e.message === 'Unknown action') return post('/api/profile', {email: who, profile: '+new'}); throw e; })
    .then((d) => {
      show('Sign in to claude.ai as ' + who, 'In the window that opened (the profile "' + (d.profile_name || 'for ' + who) + '"). Then open the page.');
      b.textContent = 'Open the page';
      b.hidden = !LINK.test(url);
    })
    .catch((e) => show('Could not set it up', e.message));
}

function open() {
  b.hidden = true;
  s.hidden = true;
  show('Finding the account that owns this page…', 'It opens in that account’s browser profile.');
  post('/api/go', {url})
    .then((d) => {
      const who = d.name || d.email || d.profile_name || 'its owner';
      if (d.trouble) show('claude.ai is having trouble', 'It showed its own error page in ' + who + '’s profile. Try again in a minute.');
      else if (d.signin) show('The profile for ' + who + ' is signed out of claude.ai', 'Sign in there once, in the window that opened, and the page loads.');
      else if (d.checked) show('Opened as ' + who, 'You can close this tab.');
      else show('Opened in ' + who + '’s profile', 'Switchboard could not check the page this time. You can close this tab.');
    })
    .catch((e) => {
      if (e.fix === 'no_profile') { show('No Chrome profile is signed in as its owner', e.message); return; }
      show('Could not open it', e.message);
    });
}

b.addEventListener('click', open);
if (!LINK.test(url)) {
  show('No claude.ai link here', 'Press the bookmark on a claude.ai page that says “Page not found”.');
} else if (owner) {
  noProfile(owner);
} else if (auto) {
  open();
} else {
  show('Open this page as its owner?', url);
  b.hidden = false;
}
</script>
</html>
