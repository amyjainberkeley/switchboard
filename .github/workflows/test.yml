name: test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/ruff-action@v3
      - name: Shell scripts parse
        run: |
          for f in install.sh uninstall.sh router/build.sh packaging/homebrew/launcher \
                   packaging/homebrew/uninstall.sh switchboard/shim/open tests/install-check.sh; do
            sh -n "$f"
          done

  test:
    runs-on: macos-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        python: ["3.9", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      # A throwaway data folder. The tests refuse to run on a real ~/.switchboard.
      - name: Tests
        run: SWITCHBOARD_HOME="$RUNNER_TEMP/switchboard/data" python -m unittest discover -s tests
